<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crusoe CDS Navigation Prototype</title>
    <!--
      GitHub Pages SPA fallback (rafgraph/spa-github-pages technique).
      GitHub Pages has no server-side routing, so a direct hit on a deep
      link like /cds-nav/orchestration would 404. This page captures the
      path and redirects to /cds-nav/?/orchestration; index.html then
      rewrites the URL back to /cds-nav/orchestration before React mounts.
      pathSegmentsToKeep = 1 preserves the /cds-nav project base.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
